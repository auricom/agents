name: skills-update

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Create app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Update skills
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: ./scripts/update-skills.sh

      - name: Commit and push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if [ -z "$(git status --porcelain -- skills skills.lock)" ]; then
            echo "No skill updates."
            exit 0
          fi
          bot="${{ steps.app.outputs.app-slug }}[bot]"
          id=$(gh api "/users/$bot" --jq .id)
          git config user.name "$bot"
          git config user.email "$id+$bot@users.noreply.github.com"
          git add -A skills skills.lock
          git commit -m "chore: update vendored skills"
          git push
